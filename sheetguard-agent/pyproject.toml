[project]
name = "sheetguard"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0",
    "langchain-openai>=0.3",
    "langgraph>=1.0",
    "langfuse==4.15.1",
    "openpyxl>=3.1",
    "networkx>=3.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.scripts]
sheetguard = "sheetguard.app.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["sheetguard*", "evaluation*"]

[tool.setuptools.package-dir]
"" = "src"
evaluation = "evaluation"
